<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="테이크원">
<title>수업 시간 안내 · 테이크원 태권도</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:#8E8E93;
  --line:#E5E5EA; --brand:#F07A86; --sep:rgba(60,60,67,0.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit;}

/* nav */
.nav{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:rgba(242,242,247,0.86); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid var(--sep);
}
.nav .back{color:var(--brand); font-size:16px; font-weight:500; display:inline-flex; align-items:center; gap:2px; min-width:64px;}
.nav .back .chev{font-size:22px; line-height:1; margin-top:-2px;}
.nav .nav-title{font-size:16px; font-weight:700;}
.nav .spacer{min-width:64px;}

/* content */
.container{max-width:560px; margin:0 auto; padding:8px 18px calc(env(safe-area-inset-bottom) + 48px);}
.large-title{font-size:30px; font-weight:800; letter-spacing:-0.5px; margin:18px 4px 4px;}
.cap{font-size:13px; color:var(--muted); font-weight:600; margin:16px 6px 8px; text-transform:none;}

/* grouped list card */
.card{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,0.03);}
.row{display:flex; align-items:center; gap:14px; padding:15px 16px; position:relative;}
.row + .row::before{content:""; position:absolute; top:0; left:64px; right:0; height:0.5px; background:var(--sep);}
.badge{
  flex-shrink:0; width:34px; height:34px; border-radius:50%;
  background:var(--brand); color:#fff; font-weight:800; font-size:15px;
  display:flex; align-items:center; justify-content:center;
}
.pname{flex:1; font-size:17px; font-weight:600; letter-spacing:-0.2px;}
.ptime{
  font-size:17px; font-weight:600; color:var(--ink);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.note{display:flex; gap:7px; color:var(--muted); font-size:13px; line-height:1.6; margin:14px 8px 0;}
.note .ii{flex-shrink:0;}
</style>
</head>
<body>

<div class="nav">
  <a class="back" href="/"><span class="chev">‹</span> 홈</a>
  <span class="nav-title">수업 시간</span>
  <span class="spacer"></span>
</div>

<div class="container">
  <h1 class="large-title">수업 시간 안내</h1>
  <div class="cap">부별 수업 시간</div>

  <div class="card">
    <div class="row"><div class="badge">1</div><div class="pname">1부 수업</div><div class="ptime">1:30 ~ 2:20</div></div>
    <div class="row"><div class="badge">2</div><div class="pname">2부 수업</div><div class="ptime">2:40 ~ 3:30</div></div>
    <div class="row"><div class="badge">3</div><div class="pname">3부 수업</div><div class="ptime">3:40 ~ 4:30</div></div>
    <div class="row"><div class="badge">4</div><div class="pname">4부 수업</div><div class="ptime">4:40 ~ 5:30</div></div>
    <div class="row"><div class="badge">5</div><div class="pname">5부 수업</div><div class="ptime">5:40 ~ 6:30</div></div>
  </div>

  <p class="note"><span class="ii">ℹ️</span><span>각 수업은 50분간 진행됩니다. 시간은 도장 사정에 따라 변경될 수 있습니다.</span></p>
</div>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
</body>
</html>
