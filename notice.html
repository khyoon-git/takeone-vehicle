<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="테이크원">
<title>공지사항 · 테이크원 태권도</title>
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--ink:#1C1C1E;--muted:#8E8E93;--line:#E5E5EA;--brand:#E11D2E;--sep:rgba(60,60,67,0.10);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
.nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(242,242,247,0.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:0.5px solid var(--sep);}
.nav .back{color:var(--brand);font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:2px;min-width:70px;}
.nav .back .chev{font-size:22px;line-height:1;margin-top:-2px;}
.nav .nav-title{font-size:16px;font-weight:700;}
.nav .spacer{min-width:70px;}
.container{max-width:620px;margin:0 auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 48px);}
.large-title{font-size:28px;font-weight:800;letter-spacing:-0.5px;margin:16px 4px 12px;}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;color:#555;cursor:pointer;}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.list{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.item:active{transform:scale(.995);}
.item .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.cat{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#FDECEE;color:var(--brand);}
.pin{font-size:11.5px;font-weight:800;color:#B45309;}
.item .ttl{font-size:16px;font-weight:700;line-height:1.4;}
.item .date{font-size:12.5px;color:var(--muted);margin-top:6px;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ico{font-size:42px;margin-bottom:10px;}
/* detail modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--sep);}
.sheet-head .x{border:none;background:#EEE;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:#555;}
.sheet-body{overflow-y:auto;padding:16px 18px calc(env(safe-area-inset-bottom) + 24px);}
.sheet-body .d-cat{display:inline-block;margin-bottom:8px;}
.sheet-body h2{font-size:20px;font-weight:800;margin:0 0 6px;line-height:1.35;}
.sheet-body .d-date{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.sheet-body .d-body{font-size:15.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:#333;}
@media(min-width:620px){.modal-bg{align-items:center;}.sheet{border-radius:20px;}}
</style>
</head>
<body>
<div class="nav">
  <a class="back" href="/"><span class="chev">‹</span> 홈</a>
  <span class="nav-title">공지사항</span>
  <span class="spacer"></span>
</div>
<div class="container">
  <h1 class="large-title">공지사항</h1>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</div>

<div class="modal-bg" id="detail">
  <div class="sheet">
    <div class="sheet-head"><span style="font-weight:800;">공지 상세</span><button class="x" onclick="closeDetail()">✕</button></div>
    <div class="sheet-body" id="detailBody"></div>
  </div>
</div>

<script>
const CATS=['전체','공지','수업','차량','행사','대회','특강','기타'];
let posts=[], curCat='전체';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){if(!s)return'';const d=new Date(s);if(isNaN(d))return'';return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
async function load(){
  try{
    const res=await fetch('/api/posts?board=notice');
    const data=await res.json();
    posts=data.posts||[];
  }catch{posts=[];}
  renderFilters();render();
}
function renderFilters(){
  document.getElementById('filters').innerHTML=CATS.map(c=>`<button class="chip ${curCat===c?'on':''}" onclick="curCat='${c}';renderFilters();render();">${c}</button>`).join('');
}
function render(){
  const box=document.getElementById('list');
  let list=posts.filter(p=>curCat==='전체'||p.카테고리===curCat);
  if(!list.length){box.innerHTML='<div class="empty"><div class="ico">📭</div>등록된 공지가 없습니다.</div>';return;}
  box.innerHTML=list.map(p=>`
    <div class="item" onclick="openDetail(${p.id})">
      <div class="top">
        ${p.상단고정?'<span class="pin">📌 고정</span>':''}
        <span class="cat">${esc(p.카테고리)}</span>
      </div>
      <div class="ttl">${esc(p.제목)}</div>
      <div class="date">${fmt(p.작성일)}</div>
    </div>`).join('');
}
function openDetail(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  document.getElementById('detailBody').innerHTML=`
    <span class="cat d-cat">${esc(p.카테고리)}</span>${p.상단고정?' <span class="pin">📌 고정</span>':''}
    <h2>${esc(p.제목)}</h2>
    <div class="d-date">${fmt(p.작성일)}</div>
    <div class="d-body">${esc(p.본문)||'(내용 없음)'}</div>`;
  document.getElementById('detail').classList.add('open');
}
function closeDetail(){document.getElementById('detail').classList.remove('open');}
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail();});
load();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
</body>
</html>
