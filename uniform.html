<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="테이크원">
<title>단체복 신청 게시판 · 테이크원 태권도</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:#8E8E93;
  --line:#E5E5EA; --brand:#E11D2E; --brand-d:#B0121F; --blue:#007AFF; --green:#34C759;
  --sep:rgba(60,60,67,0.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
.hero{background:#fff;padding:calc(env(safe-area-inset-top) + 20px) 20px 22px;border-bottom:1px solid var(--line);}
.hero a.home{display:inline-block;font-size:13px;color:var(--muted);margin-bottom:10px;}
.hero-badge{display:inline-block;background:#FDECEE;color:var(--brand-d);font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;margin-bottom:9px;}
.hero-title{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.hero-sub{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
.seg-bar{position:sticky;top:0;z-index:9;background:rgba(242,242,247,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 16px;border-bottom:0.5px solid var(--sep);}
.seg{display:flex;background:#E9E9EB;border-radius:10px;padding:3px;max-width:560px;margin:0 auto;}
.seg-btn{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;color:#555;cursor:pointer;}
.seg-btn.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.wrap{max-width:560px;margin:0 auto;padding:16px;}
.closed-banner{background:#FFECEC;border:1px solid #F3B4B4;color:var(--brand-d);font-weight:700;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14px;text-align:center;line-height:1.5;}
.sh{font-size:13px;font-weight:700;color:#6b6b70;margin:18px 4px 8px;}
.sh:first-child{margin-top:4px;}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.ifield{margin-bottom:12px;}
.ifield:last-child{margin-bottom:0;}
.ifield label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.row{display:flex;gap:8px;}
.input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font-size:16px;font-family:inherit;outline:none;color:var(--ink);background:#fff;}
.input:focus{border-color:var(--brand);}
.eye{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;cursor:pointer;font-size:16px;flex-shrink:0;}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;font-family:inherit;font-size:14.5px;font-weight:600;color:#333;cursor:pointer;min-height:44px;}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;width:150px;}
.qty button{width:46px;height:46px;border:none;background:#F7F7F9;font-size:22px;color:var(--brand);cursor:pointer;font-family:inherit;}
.qty button:active{background:#EDEDF0;}
.qty .q{flex:1;text-align:center;font-size:17px;font-weight:700;}
.cta{width:100%;border:none;border-radius:13px;padding:15px;font-family:inherit;font-size:16px;font-weight:800;color:#fff;cursor:pointer;margin-top:16px;}
.cta-red{background:var(--brand);}
.cta-red:disabled{background:#E5B6ba;}
.cta-blue{background:var(--blue);}
.emsg{color:var(--brand);font-size:13px;margin-top:8px;display:none;}
.emsg.show{display:block;}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;}
/* 조회 결과 카드 */
.ocard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.ocard .ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ocard .obadge{background:#FDECEE;color:var(--brand-d);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;}
.ocard .paid{background:#DCFCE7;color:#15803D;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}
.ocard .orow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.selin{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
.ocard .oact{display:flex;gap:8px;margin-top:12px;}
.btn{border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;padding:11px;font-size:14px;flex:1;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-gray{background:#EAEAEC;color:#333;}
/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:18px;padding:26px 22px;max-width:360px;width:100%;text-align:center;}
.modal h3{margin:0 0 10px;font-size:19px;font-weight:800;}
.modal p{margin:0 0 20px;color:#6E6E73;font-size:14.5px;line-height:1.6;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:rgba(20,20,22,.92);color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;font-weight:600;transition:transform .28s;z-index:200;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:rgba(22,163,74,.95);}
.safe-b{height:calc(env(safe-area-inset-bottom) + 30px);}
</style>
</head>
<body>

<div class="hero">
  <a class="home" href="/">← 테이크원 홈</a>
  <div class="hero-badge">👕 TAKE1 단체복</div>
  <div class="hero-title">단체복 신청 게시판</div>
  <div class="hero-sub">사이즈·수량을 선택해 신청하고, 이름·PIN으로 언제든 조회·수정할 수 있습니다.</div>
</div>

<div class="seg-bar">
  <div class="seg">
    <button class="seg-btn on" id="tabBtnForm" onclick="showTab('form')">신청하기</button>
    <button class="seg-btn" id="tabBtnLookup" onclick="showTab('lookup')">조회·수정</button>
  </div>
</div>

<!-- 신청하기 -->
<div class="wrap" id="tab-form">
  <div id="closed-banner" class="closed-banner" style="display:none;"></div>

  <p class="sh">① 신청 정보</p>
  <div class="gcard">
    <div class="ifield"><label>이름</label><input class="input" id="f-name" maxlength="20" placeholder="수련생 이름"></div>
    <div class="ifield"><label>학년</label><input class="input" id="f-grade" maxlength="20" placeholder="예) 초등 2학년 / 7세"></div>
    <div class="ifield">
      <label>소속관</label>
      <div class="opts" id="f-bldg"></div>
    </div>
  </div>

  <p class="sh">② 사이즈 &amp; 수량</p>
  <div class="gcard">
    <div class="ifield">
      <label>사이즈</label>
      <div class="opts" id="f-size"></div>
    </div>
    <div class="ifield">
      <label>수량</label>
      <div class="qty"><button type="button" onclick="bumpQty(-1)">−</button><div class="q" id="f-qty">1</div><button type="button" onclick="bumpQty(1)">+</button></div>
    </div>
  </div>

  <p class="sh">③ 입금 정보</p>
  <div class="gcard">
    <div class="ifield"><label>입금자명</label><input class="input" id="f-depositor" maxlength="20" placeholder="입금하실 분 성함"></div>
    <div class="ifield">
      <label>확인용 비밀번호 (PIN 4자리)</label>
      <div class="row">
        <input class="input" id="f-pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="숫자 4자리" style="letter-spacing:4px;" oninput="this.value=this.value.replace(/\D/g,'')">
        <button class="eye" type="button" onclick="eye('f-pin')">👁</button>
      </div>
    </div>
    <div class="hint">※ PIN 4자리를 설정하면 나중에 '조회·수정'에서 이름과 PIN으로 신청 내역을 확인·수정할 수 있습니다.</div>
  </div>

  <div class="emsg" id="err-form"></div>
  <button class="cta cta-red" id="submitBtn" onclick="submitOrder()">✅ 신청 완료</button>
  <div class="hint" style="text-align:center;">여러 벌(다른 사이즈)을 신청하려면, 한 번 신청 후 다시 신청해 주세요.</div>
  <div class="safe-b"></div>
</div>

<!-- 조회·수정 -->
<div class="wrap" id="tab-lookup" style="display:none;">
  <p class="sh">이름 &amp; PIN으로 조회</p>
  <div class="gcard">
    <div class="ifield"><label>이름</label><input class="input" id="l-name" maxlength="20" placeholder="신청한 이름"></div>
    <div class="ifield">
      <label>PIN 4자리</label>
      <div class="row">
        <input class="input" id="l-pin" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="숫자 4자리" style="letter-spacing:4px;" oninput="this.value=this.value.replace(/\D/g,'')" onkeydown="if(event.key==='Enter')lookup()">
        <button class="eye" type="button" onclick="eye('l-pin')">👁</button>
      </div>
    </div>
    <div class="emsg" id="err-lookup"></div>
    <button class="cta cta-blue" id="lookupBtn" onclick="lookup()" style="margin-top:12px;">조회하기</button>
  </div>
  <div id="lookupResult" style="margin-top:14px;"></div>
  <div class="safe-b"></div>
</div>

<div class="modal-bg" id="modal-done">
  <div class="modal">
    <div style="font-size:52px;line-height:1;margin-bottom:14px;">🎉</div>
    <h3>신청이 완료되었습니다!</h3>
    <p>단체복 신청이 정상적으로 접수되었습니다.<br>입금 확인 후 최종 확정됩니다.</p>
    <button class="cta cta-red" style="margin:0;" onclick="closeDone()">확인</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BUILDINGS=['본관','별관','소양관'];
let OPEN=true, SIZES=[];
let selBldg='', selSize='', qty=1;
let lookupRows=[];

async function api(path,{method='GET',body}={}){
  const headers={}; if(body)headers['Content-Type']='application/json';
  const res=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});
  let data={}; try{data=await res.json();}catch{}
  if(!res.ok){const e=new Error(data.error||('요청 실패('+res.status+')'));e.status=res.status;throw e;}
  return data;
}
function eye(id){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';}
function showTab(t){
  document.getElementById('tab-form').style.display=t==='form'?'':'none';
  document.getElementById('tab-lookup').style.display=t==='lookup'?'':'none';
  document.getElementById('tabBtnForm').classList.toggle('on',t==='form');
  document.getElementById('tabBtnLookup').classList.toggle('on',t==='lookup');
}
function showE(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.add('show');}
function clrE(id){document.getElementById(id).classList.remove('show');}
let _tt; function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(type?' '+type:'');clearTimeout(_tt);_tt=setTimeout(()=>el.className='toast',2600);}

function renderBuildings(){
  document.getElementById('f-bldg').innerHTML=BUILDINGS.map(b=>
    `<button type="button" class="opt ${selBldg===b?'on':''}" onclick="selBldg='${b}';renderBuildings();">${b}</button>`).join('');
}
function renderSizes(){
  const box=document.getElementById('f-size');
  if(!SIZES.length){box.innerHTML='<span class="hint">신청 가능한 사이즈가 아직 등록되지 않았습니다.</span>';return;}
  box.innerHTML=SIZES.map(s=>
    `<button type="button" class="opt ${selSize===s?'on':''}" onclick="selSize='${s.replace(/'/g,"\\'")}';renderSizes();">${s}</button>`).join('');
}
function bumpQty(d){qty=Math.max(1,Math.min(99,qty+d));document.getElementById('f-qty').textContent=qty;}

async function loadStatus(){
  try{
    const r=await api('/api/uniform-status');
    OPEN=!!r.open; SIZES=Array.isArray(r.sizes)?r.sizes:[];
    const banner=document.getElementById('closed-banner');
    if(OPEN){banner.style.display='none';}
    else{banner.textContent='🚫 현재 단체복 신청 접수 기간이 아닙니다.';banner.style.display='';}
    document.getElementById('submitBtn').disabled=!OPEN;
    renderSizes();
  }catch{OPEN=true;}
}

async function submitOrder(){
  if(!OPEN)return toast('현재 신청 접수 기간이 아닙니다.');
  const name=document.getElementById('f-name').value.trim();
  const grade=document.getElementById('f-grade').value.trim();
  const depositor=document.getElementById('f-depositor').value.trim();
  const pin=document.getElementById('f-pin').value.trim();
  clrE('err-form');
  if(!name)return showE('err-form','이름을 입력해 주세요');
  if(!selBldg)return showE('err-form','소속관을 선택해 주세요');
  if(!selSize)return showE('err-form','사이즈를 선택해 주세요');
  if(!depositor)return showE('err-form','입금자명을 입력해 주세요');
  if(!/^\d{4}$/.test(pin))return showE('err-form','PIN을 숫자 4자리로 입력해 주세요');
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='제출 중…';
  try{
    await api('/api/uniform',{method:'POST',body:{name,grade,building:selBldg,size:selSize,qty,depositor,pin}});
    document.getElementById('modal-done').classList.add('open');
    // reset (이름/PIN/입금자명은 유지하면 추가 신청 편함)
    selSize='';qty=1;document.getElementById('f-qty').textContent='1';renderSizes();
  }catch(e){showE('err-form','⚠️ '+e.message);}
  finally{btn.disabled=!OPEN;btn.textContent='✅ 신청 완료';}
}
function closeDone(){document.getElementById('modal-done').classList.remove('open');}

async function lookup(){
  const name=document.getElementById('l-name').value.trim();
  const pin=document.getElementById('l-pin').value.trim();
  clrE('err-lookup');
  if(!name)return showE('err-lookup','이름을 입력해 주세요');
  if(!pin)return showE('err-lookup','PIN을 입력해 주세요');
  const btn=document.getElementById('lookupBtn');btn.disabled=true;btn.textContent='조회 중…';
  try{
    const r=await api('/api/uniform-lookup',{method:'POST',body:{name,pin}});
    lookupRows=r.orders||[];
    renderLookup(name,pin);
  }catch(e){showE('err-lookup',e.message);}
  finally{btn.disabled=false;btn.textContent='조회하기';}
}
function sizeOptions(cur){
  return SIZES.map(s=>`<option ${s===cur?'selected':''}>${s}</option>`).join('')
    + (SIZES.includes(cur)?'':`<option selected>${cur}</option>`);
}
function renderLookup(name,pin){
  const box=document.getElementById('lookupResult');
  if(!lookupRows.length){box.innerHTML='<div class="hint" style="text-align:center;padding:10px;">일치하는 신청 내역이 없습니다.</div>';return;}
  box.innerHTML=`<p class="sh">${name} 님 신청 내역 ${lookupRows.length}건</p>`+lookupRows.map((o,i)=>`
    <div class="ocard">
      <div class="ohead">
        <span class="obadge">${o.소속관||'-'} · ${o.학년||'학년 미입력'}</span>
        ${o.입금확인?'<span class="paid">입금확인 완료</span>':''}
      </div>
      <div class="orow">
        <select class="selin" id="ls-${i}" ${OPEN?'':'disabled'}>${sizeOptions(o.사이즈)}</select>
        <div class="qty" style="width:138px;"><button type="button" onclick="lq(${i},-1)" ${OPEN?'':'disabled'}>−</button><div class="q" id="lq-${i}">${o.수량}</div><button type="button" onclick="lq(${i},1)" ${OPEN?'':'disabled'}>+</button></div>
      </div>
      <div class="hint">입금자명: ${o.입금자명||'-'}</div>
      ${OPEN?`<div class="oact">
        <button class="btn btn-blue" onclick="saveLookup(${i},'${encodeURIComponent(name)}','${pin}')">저장</button>
        <button class="btn btn-gray" onclick="cancelLookup(${i},'${encodeURIComponent(name)}','${pin}')">신청 취소</button>
      </div>`:'<div class="hint">※ 접수 마감 상태에서는 수정할 수 없습니다.</div>'}
    </div>`).join('');
}
function lq(i,d){const el=document.getElementById('lq-'+i);let v=parseInt(el.textContent,10)||1;v=Math.max(1,Math.min(99,v+d));el.textContent=v;}
async function saveLookup(i,encName,pin){
  const name=decodeURIComponent(encName);
  const o=lookupRows[i];
  const size=document.getElementById('ls-'+i).value;
  const q=parseInt(document.getElementById('lq-'+i).textContent,10)||1;
  try{
    await api('/api/uniform-edit',{method:'POST',body:{name,pin,id:o.id,size,qty:q}});
    toast('수정되었습니다','ok');lookup();
  }catch(e){toast('⚠️ '+e.message);}
}
async function cancelLookup(i,encName,pin){
  if(!confirm('이 신청을 취소(삭제)할까요?'))return;
  const name=decodeURIComponent(encName);
  const o=lookupRows[i];
  try{
    await api('/api/uniform-edit',{method:'POST',body:{name,pin,id:o.id,mode:'delete'}});
    toast('신청이 취소되었습니다');lookup();
  }catch(e){toast('⚠️ '+e.message);}
}

renderBuildings();
loadStatus();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
</body>
</html>
