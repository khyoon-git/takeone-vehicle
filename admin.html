<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>관리자 · 테이크원 태권도</title>
<style>
:root{--purple:#7C3AED;--bg:#F1F5F9;--line:#E2E8F0;--ink:#0F172A;--muted:#64748B;--red:#EF4444;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}
.page{display:none;} .page.active{display:block;}
/* login */
.login-page.active{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
.login-card{background:#fff;width:100%;max-width:400px;border-radius:16px;box-shadow:0 10px 40px rgba(15,23,42,.12);padding:36px 32px;}
.login-icon{font-size:44px;text-align:center;line-height:1;}
.login-title{font-size:22px;font-weight:800;text-align:center;margin:12px 0 4px;}
.login-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:24px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field .row{display:flex;gap:8px;}
.input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit;outline:none;color:var(--ink);background:#fff;}
.input:focus{border-color:var(--purple);}
.emsg{color:var(--red);font-size:13px;display:none;margin:8px 0 2px;} .emsg.show{display:block;}
.eye{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;cursor:pointer;font-size:16px;flex-shrink:0;}
.btn{border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 15px;font-size:14px;}
.btn-full{width:100%;padding:13px;font-size:15px;margin-top:14px;}
.btn-purple{background:var(--purple);color:#fff;} .btn-ghost{background:#fff;color:#334155;border:1.5px solid var(--line);}
/* topbar */
.topbar{background:#fff;border-bottom:1px solid var(--line);}
.topbar-in{max-width:1000px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:10px;}
.brand{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;}
.brand .pill{background:var(--purple);color:#fff;font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;}
.spacer{flex:1;}
/* hub */
.wrap{max-width:1000px;margin:0 auto;padding:26px 22px 60px;}
.wrap h2{font-size:18px;font-weight:800;margin:4px 2px 4px;}
.wrap .sub{font-size:13.5px;color:var(--muted);margin:0 2px 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.mcard{position:relative;display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px;transition:transform .15s,box-shadow .15s,border-color .15s;}
a.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,23,42,.10);border-color:#CBD5E1;}
.mcard .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;background:#F3EEFF;margin-bottom:13px;}
.mcard h3{margin:0 0 4px;font-size:16.5px;font-weight:800;}
.mcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}
.mcard .go{margin-top:12px;font-size:13px;font-weight:800;color:var(--purple);}
.mcard.soon{background:#FAFBFC;}
.mcard.soon .ic{background:#EEF0F4;}
.mcard.soon h3{color:#9AA1AE;}
.badge-soon{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;color:#8A93A3;background:#EEF0F4;padding:3px 9px;border-radius:999px;}
.num{position:absolute;top:14px;left:16px;font-size:12px;font-weight:800;color:#CBD5E1;}
.mcard .ic{margin-top:10px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="page login-page active" id="page-login">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <div class="login-title">테이크원 관리자</div>
    <div class="login-sub">게시판별 관리 페이지로 이동합니다</div>
    <div class="field">
      <label>비밀번호</label>
      <div class="row">
        <input class="input" type="password" id="pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
        <button class="eye" type="button" onclick="eye('pw')">👁</button>
      </div>
    </div>
    <div class="emsg" id="err">비밀번호가 올바르지 않습니다</div>
    <button class="btn btn-purple btn-full" id="loginBtn" onclick="login()">로그인</button>
    <div style="text-align:center;margin-top:14px;"><a href="/" style="color:var(--muted);font-size:13px;">← 홈으로</a></div>
  </div>
</div>

<!-- HUB -->
<div class="page" id="page-hub">
  <div class="topbar"><div class="topbar-in">
    <div class="brand"><span class="pill">테이크원</span> 관리자</div>
    <span class="spacer"></span>
    <a class="btn btn-ghost" href="/">홈 보기</a>
    <button class="btn btn-ghost" onclick="logout()">로그아웃</button>
  </div></div>
  <div class="wrap">
    <h2>게시판 관리</h2>
    <p class="sub">관리할 항목을 선택하세요.</p>
    <div class="grid" id="hubGrid"></div>
  </div>
</div>

<script>
let adminKey=sessionStorage.getItem('to_admin_key')||'';

// 관리 페이지 목록 (요청 순서대로)
const BOARDS=[
  {icon:'🥋', title:'도장 소개', desc:'도장 소개 내용 관리', href:'', ready:false},
  {icon:'📢', title:'공지사항', desc:'공지 등록·수정', href:'', ready:false},
  {icon:'📄', title:'안내문', desc:'안내문 관리', href:'', ready:false},
  {icon:'🗓️', title:'시간표', desc:'수업 시간표 관리', href:'', ready:false},
  {icon:'📍', title:'오시는 길', desc:'위치·지도 관리', href:'', ready:false},
  {icon:'🚌', title:'차량 신청', desc:'신청 시작/마감 · 신청 내역 · 엑셀', href:'/admin-vehicle', ready:true},
  {icon:'👕', title:'단체복 신청', desc:'사이즈 설정 · 신청 내역 · 입금확인 · 엑셀', href:'/uniform-admin', ready:true},
];

function eye(id){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');}

async function login(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err');
  if(!pw){err.textContent='비밀번호를 입력해 주세요';err.classList.add('show');return;}
  const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='확인 중…';
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(!res.ok)throw new Error('fail');
    adminKey=pw;sessionStorage.setItem('to_admin_key',pw);
    document.getElementById('pw').value='';err.classList.remove('show');
    renderHub();showPage('hub');
  }catch(e){err.textContent='비밀번호가 올바르지 않습니다';err.classList.add('show');}
  finally{b.disabled=false;b.textContent='로그인';}
}
function logout(){adminKey='';sessionStorage.removeItem('to_admin_key');showPage('login');}

function renderHub(){
  document.getElementById('hubGrid').innerHTML=BOARDS.map((m,i)=>{
    const n=`<span class="num">${i+1}</span>`;
    if(m.ready){
      return `<a class="mcard" href="${m.href}">${n}<div class="ic">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p><div class="go">관리하기 →</div></a>`;
    }
    return `<div class="mcard soon">${n}<span class="badge-soon">준비중</span><div class="ic">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p></div>`;
  }).join('');
}

// 저장된 키가 있으면 자동 로그인(검증)
(async()=>{
  if(adminKey){
    try{
      const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:adminKey})});
      if(res.ok){ renderHub(); showPage('hub'); return; }
    }catch(e){}
    logout();
  }
})();
</script>
</body>
</html>
