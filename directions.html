<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>오시는 길 · 테이크원 태권도</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:#8E8E93;
  --line:#E5E5EA; --brand:#E11D2E; --naver:#03C75A; --sep:rgba(60,60,67,0.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit;}
.nav{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:rgba(242,242,247,0.86); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid var(--sep);
}
.nav .back{color:var(--brand); font-size:16px; font-weight:500; display:inline-flex; align-items:center; gap:2px; min-width:64px;}
.nav .back .chev{font-size:22px; line-height:1; margin-top:-2px;}
.nav .nav-title{font-size:16px; font-weight:700;}
.nav .spacer{min-width:64px;}
.container{max-width:560px; margin:0 auto; padding:8px 18px calc(env(safe-area-inset-bottom) + 48px);}
.large-title{font-size:30px; font-weight:800; letter-spacing:-0.5px; margin:18px 4px 4px;}
.cap{font-size:13px; color:var(--muted); font-weight:600; margin:16px 6px 8px;}

.card{background:var(--card); border-radius:16px; padding:18px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,0.03);}
.card.soon{background:#FAFBFC;}
.row-head{display:flex; align-items:center; gap:13px; margin-bottom:14px;}
.badge{
  flex-shrink:0; width:40px; height:40px; border-radius:12px;
  background:var(--brand); color:#fff; font-weight:800; font-size:17px;
  display:flex; align-items:center; justify-content:center;
}
.card.soon .badge{background:#C7CBD3;}
.pname{font-size:18px; font-weight:800; letter-spacing:-0.3px;}
.paddr{font-size:13.5px; color:var(--muted); margin-top:2px;}
.maplink{
  display:flex; align-items:center; justify-content:center; gap:7px;
  background:var(--naver); color:#fff; font-weight:800; font-size:15px;
  padding:13px; border-radius:12px;
}
.maplink:active{filter:brightness(.95);}
.soon-tag{font-size:12px; font-weight:800; color:#8A93A3; background:#EEF0F4; padding:8px; border-radius:10px; text-align:center;}
.note{display:flex; gap:7px; color:var(--muted); font-size:13px; line-height:1.6; margin:14px 8px 0;}
</style>
</head>
<body>
